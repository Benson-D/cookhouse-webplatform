version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # zod is pinned to v3 to match the backend's AppRouter type inference
      # across the package boundary (see CLAUDE.md) — a major bump here
      # would silently break that, so never auto-propose it.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
